name: package-contract

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdu-rpc-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64 / default
            os: ubuntu-latest
            config: hakoniwa-build.yaml
            build_type: Release
          - name: Ubuntu x64 / alternate
            os: ubuntu-latest
            config: test/fixtures/alternate-build.yaml
            build_type: Debug
          - name: Ubuntu ARM64 / default
            os: ubuntu-24.04-arm
            config: hakoniwa-build.yaml
            build_type: Release
          - name: Ubuntu ARM64 / alternate
            os: ubuntu-24.04-arm
            config: test/fixtures/alternate-build.yaml
            build_type: Debug
          - name: macOS / default
            os: macos-15
            config: hakoniwa-build.yaml
            build_type: Release
          - name: macOS / alternate
            os: macos-15
            config: test/fixtures/alternate-build.yaml
            build_type: Debug
          - name: Windows x64 / default
            os: windows-2025
            config: hakoniwa-build.yaml
            build_type: Release
          - name: Windows x64 / alternate
            os: windows-2025
            config: test/fixtures/alternate-build.yaml
            build_type: Debug

    steps:
      - name: Checkout with Registry submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test build manifest resolver
        run: python -m unittest tools/test_hako.py -v

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake boost

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-asio:x64-windows boost-beast:x64-windows

      - name: Build and install PIC static Core-free Endpoint package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF \
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config "${{ matrix.build_type }}" --target hakoniwa_pdu_endpoint --parallel
          cmake --install endpoint/build --config "${{ matrix.build_type }}" --prefix "${GITHUB_WORKSPACE}/endpoint-install"
          echo "HAKO_PDU_ENDPOINT_ROOT=${GITHUB_WORKSPACE}/endpoint-install" >> "$GITHUB_ENV"

      - name: Build and install static Core-free Endpoint package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build -A x64 `
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/endpoint-install" `
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF `
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config "${{ matrix.build_type }}" --target hakoniwa_pdu_endpoint --parallel
          cmake --install endpoint/build --config "${{ matrix.build_type }}" --prefix "$env:GITHUB_WORKSPACE/endpoint-install"
          "HAKO_PDU_ENDPOINT_ROOT=$env:GITHUB_WORKSPACE/endpoint-install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Doctor
        run: python tools/hako.py doctor --config "${{ matrix.config }}"

      - name: Configure dry-run
        run: python tools/hako.py configure --config "${{ matrix.config }}" --dry-run

      - name: Configure
        run: python tools/hako.py configure --config "${{ matrix.config }}"

      - name: Build
        run: python tools/hako.py build --config "${{ matrix.config }}"

      - name: Reviewed RPC contract tests
        if: matrix.config == 'hakoniwa-build.yaml' || matrix.os == 'ubuntu-latest'
        run: python tools/hako.py test --config "${{ matrix.config }}" --build-type "${{ matrix.build_type }}"

      - name: Install
        run: python tools/hako.py install --config "${{ matrix.config }}"

      - name: Installed package consumer
        run: python tools/hako.py package-test --config "${{ matrix.config }}"

      - name: Smoke
        run: python tools/hako.py smoke --config "${{ matrix.config }}"
