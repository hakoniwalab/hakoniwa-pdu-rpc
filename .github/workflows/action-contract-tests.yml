name: action-contract-tests

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdu-rpc-action-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            os: ubuntu-latest
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-15
          - name: Windows x64
            os: windows-2025

    steps:
      - name: Checkout with Registry submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test hako.py contracts
        run: python -m unittest tools/test_hako.py tools/test_hako_operations.py -v

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake boost

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-asio:x64-windows boost-beast:x64-windows

      # Native contracts use a static Core-free Endpoint on every platform.
      # This avoids mixing the shared Endpoint package configuration used by
      # package/CFFI jobs with the historical static native RPC target.
      - name: Build and install static Core-free Endpoint package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF \
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --target hakoniwa_pdu_endpoint --parallel
          cmake --install endpoint/build --config Release --prefix "${GITHUB_WORKSPACE}/endpoint-install"
          echo "HAKO_PDU_ENDPOINT_ROOT=${GITHUB_WORKSPACE}/endpoint-install" >> "$GITHUB_ENV"

      - name: Build and install static Core-free Endpoint package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/endpoint-install" `
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF `
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --target hakoniwa_pdu_endpoint --parallel
          cmake --install endpoint/build --config Release --prefix "$env:GITHUB_WORKSPACE/endpoint-install"
          "HAKO_PDU_ENDPOINT_ROOT=$env:GITHUB_WORKSPACE/endpoint-install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Some reviewed Action targets are linked to the static RPC library but
          # still need the shared Endpoint runtime DLL. Make the installed runtime
          # visible to CTest on Windows instead of relying on per-target staging.
          "$env:GITHUB_WORKSPACE\endpoint-install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Doctor
        run: python tools/hako.py doctor

      - name: Reviewed Service and Action contracts
        run: python tools/hako.py test