name: rpc-basic-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdu-rpc-basic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            os: ubuntu-latest
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-15
          - name: Windows x64
            os: windows-2025

    steps:
      - name: Checkout with Registry submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip cffi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake boost

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-asio:x64-windows boost-beast:x64-windows

      - name: Build and install Core-free Endpoint package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF \
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --target hakoniwa_pdu_endpoint --parallel
          cmake --install endpoint/build --config Release --prefix "${GITHUB_WORKSPACE}/endpoint-install"
          echo "HAKO_PDU_ENDPOINT_ROOT=${GITHUB_WORKSPACE}/endpoint-install" >> "$GITHUB_ENV"

      - name: Build and install Core-free Endpoint package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/endpoint-install" `
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF `
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --target hakoniwa_pdu_endpoint --parallel
          cmake --install endpoint/build --config Release --prefix "$env:GITHUB_WORKSPACE/endpoint-install"
          "HAKO_PDU_ENDPOINT_ROOT=$env:GITHUB_WORKSPACE/endpoint-install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Doctor
        run: python tools/hako.py doctor

      - name: Phase 1 basic RPC tests
        run: python tools/hako.py test-basic

      - name: Configure shared RPC library
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build-cffi \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DHAKO_PDU_ENDPOINT_PREFIX="${HAKO_PDU_ENDPOINT_ROOT}" \
            -DHAKO_PDU_RPC_BUILD_TESTS=OFF \
            -DHAKO_PDU_RPC_BUILD_EXAMPLES=OFF
          cmake --build build-cffi --config Release --parallel
          echo "HAKO_PDU_RPC_LIB_DIR=${GITHUB_WORKSPACE}/build-cffi/src" >> "$GITHUB_ENV"

      - name: Configure shared RPC library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-cffi -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_SHARED_LIBS=ON `
            -DHAKO_PDU_ENDPOINT_PREFIX="$env:HAKO_PDU_ENDPOINT_ROOT" `
            -DHAKO_PDU_RPC_BUILD_TESTS=OFF `
            -DHAKO_PDU_RPC_BUILD_EXAMPLES=OFF
          cmake --build build-cffi --config Release --parallel
          "HAKO_PDU_RPC_LIB_DIR=$env:GITHUB_WORKSPACE/build-cffi/src/Release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build CFFI extension
        run: python python/hakoniwa_pdu_rpc/build_c_rpc_ffi.py

      - name: Import CFFI extension on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/build/python:${GITHUB_WORKSPACE}/python"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-cffi/src:${GITHUB_WORKSPACE}/endpoint-install/lib:${LD_LIBRARY_PATH:-}"
          python -c "from hakoniwa_pdu_rpc import RpcClient, RpcServer; print(RpcClient, RpcServer)"

      - name: Import CFFI extension on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/build/python:${GITHUB_WORKSPACE}/python"
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-cffi/src:${GITHUB_WORKSPACE}/endpoint-install/lib:${DYLD_LIBRARY_PATH:-}"
          python -c "from hakoniwa_pdu_rpc import RpcClient, RpcServer; print(RpcClient, RpcServer)"

      - name: Import CFFI extension on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/build/python;$env:GITHUB_WORKSPACE/python"
          $env:PATH = "$env:GITHUB_WORKSPACE/build-cffi/src/Release;$env:GITHUB_WORKSPACE/endpoint-install/bin;$env:PATH"
          python -c "from hakoniwa_pdu_rpc import RpcClient, RpcServer; print(RpcClient, RpcServer)"
