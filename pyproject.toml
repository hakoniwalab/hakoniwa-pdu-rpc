[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hakoniwa-pdu-rpc"
version = "0.1.0"
description = "Hakoniwa PDU RPC Service and Action Python bindings"
requires-python = ">=3.12"
dependencies = [
  "cffi>=1.0",
  "jsonschema>=4.0",
]

[project.scripts]
hako-pdu-rpc-generate-action-config = "hakoniwa_pdu_rpc.action_config_generator:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.data-files]
"share/hakoniwa-pdu-rpc/schema" = [
  "config/schema/action-schema.json",
  "config/schema/endpoints-schema.json",
  "config/schema/service-schema.json",
]
